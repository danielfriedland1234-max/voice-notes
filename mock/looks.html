<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Look and Feel Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    /* ---------- The page around the phones ---------- */
    :root { --page: #e9e9ee; --page-text: #1d1d22; --page-muted: #6b6b76; --chip: #fff; --chip-on: #1d1d22; --chip-on-text: #fff; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --page: #141418; --page-text: #ececf1; --page-muted: #9a9aa6; --chip: #23232a; --chip-on: #ececf1; --chip-on-text: #141418; }
    }
    :root[data-theme="dark"] { --page: #141418; --page-text: #ececf1; --page-muted: #9a9aa6; --chip: #23232a; --chip-on: #ececf1; --chip-on-text: #141418; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--page-text); font: 15px/1.45 Inter, system-ui, sans-serif; }
    .page { max-width: 1640px; margin: 0 auto; padding: 24px 16px 48px; }
    .page h1 { font-size: 24px; margin: 0 0 4px; }
    .page > p { color: var(--page-muted); margin: 0 0 16px; }
    .switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; position: sticky; top: 0; padding: 8px 0; background: var(--page); z-index: 5; }
    .switch button {
      border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; font-weight: 600;
      background: var(--chip); color: var(--page-text); cursor: pointer;
    }
    .switch button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 32px 24px; justify-items: center; }
    .option { width: 100%; max-width: 360px; }
    .option h2 { font-size: 18px; margin: 14px 4px 2px; }
    .option p { color: var(--page-muted); margin: 0 4px 8px; }
    .swatches { display: flex; gap: 6px; margin: 0 4px; }
    .swatches span { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgb(127 127 127 / 0.3); }

    /* ---------- Phone frame ---------- */
    .phone {
      width: 100%; aspect-ratio: 360 / 740; border-radius: 44px; padding: 10px;
      background: #0b0b0d; box-shadow: 0 20px 50px rgb(0 0 0 / 0.25);
    }
    .screen {
      position: relative; height: 100%; border-radius: 34px; overflow: hidden;
      background: var(--bg); color: var(--text); font-family: var(--font);
      padding: 0 18px; display: flex; flex-direction: column;
    }
    .statusbar { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; padding: 12px 6px 4px; opacity: 0.8; }

    /* ---------- App pieces, styled per theme with variables ---------- */
    .top { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 14px; }
    .top h1 { margin: 0; font-family: var(--head-font); font-size: var(--title-size, 24px); font-weight: var(--title-weight, 700); letter-spacing: var(--title-spacing, 0); }
    .top .sub { display: block; font-size: 13px; color: var(--muted); font-weight: 600; font-family: var(--font); }
    .gear { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--text); background: var(--gear-bg, transparent); border: var(--gear-border, 0); }
    .gear svg { width: 22px; height: 22px; fill: currentColor; }
    .back { font-size: 22px; }
    .top.center h1 { font-size: 17px; text-align: center; flex: 1; }
    .top.center .spacer { width: 40px; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 14px;
      background: var(--tab-track); border-radius: var(--tab-radius); border: var(--tab-border, 0); }
    .tab { padding: 10px 0; text-align: center; font-weight: 700; border-radius: calc(var(--tab-radius) - 4px); color: var(--muted); }
    .tab.on { background: var(--tab-on); color: var(--tab-on-text); box-shadow: var(--tab-shadow, none); }

    .new { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; font-weight: 700; font-size: 17px;
      border-radius: var(--btn-radius); background: var(--new-bg); color: var(--new-text); border: var(--new-border, 0); box-shadow: var(--new-shadow, none); }
    .new .plus { font-size: 24px; line-height: 1; font-weight: 400; }

    .sec { font-family: var(--head-font); font-size: 16px; margin: 20px 2px 10px; font-weight: 700; color: var(--sec-color, var(--text)); }

    .card { background: var(--surface); border: var(--card-border); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 10px; box-shadow: var(--card-shadow, none); }
    .date { font-size: 12.5px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
    .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; }
    .pv { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pv::before { content: ''; display: inline-block; width: 13px; height: 13px; border: 2px solid var(--muted); border-radius: var(--box-radius); margin-right: 8px; vertical-align: -1px; }
    .meta { font-size: 12.5px; color: var(--muted); margin-top: 5px; font-weight: 600; }

    /* Recording screen */
    .live { flex: 1; background: var(--surface); border: var(--card-border); border-radius: var(--radius); padding: 4px 14px; box-shadow: var(--card-shadow, none); min-height: 0; }
    .todo { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
    .todo:last-child { border-bottom-color: transparent; }
    .box { flex: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: var(--box-radius); }
    .todo.current { border-bottom: 2px solid var(--accent); }
    .todo.current .t::after { content: ''; display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; background: var(--accent); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .controls { text-align: center; padding: 14px 0 20px; }
    .rec { width: 84px; height: 84px; margin: 0 auto; display: grid; place-items: center;
      border-radius: var(--rec-radius, 50%); background: var(--rec-bg); border: var(--rec-border, 0); box-shadow: var(--rec-shadow); }
    .rec i { width: 28px; height: 28px; border-radius: 7px; background: var(--rec-icon, #fff); }
    .timer { font-weight: 700; margin: 8px 0 12px; font-variant-numeric: tabular-nums; font-size: 17px; }
    .nl { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; font-size: 18px; font-weight: 700;
      border-radius: var(--btn-radius); background: var(--nl-bg, var(--new-bg)); color: var(--nl-text, var(--new-text)); border: var(--new-border, 0); box-shadow: var(--new-shadow, none); }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

    /* ---------- 1. Midnight Glow ---------- */
    .t-glow {
      --bg: radial-gradient(120% 60% at 100% 0%, #3b1d6e 0%, transparent 60%), radial-gradient(90% 50% at 0% 100%, #4a1240 0%, transparent 60%), #0e0b1f;
      --surface: rgb(255 255 255 / 0.06); --text: #f4f0ff; --muted: #a59cc4; --line: rgb(255 255 255 / 0.08);
      --accent: #c084fc; --font: Inter, sans-serif; --head-font: Inter, sans-serif; --title-weight: 800; --title-spacing: -0.02em;
      --radius: 20px; --card-border: 1px solid rgb(255 255 255 / 0.1); --btn-radius: 18px; --box-radius: 7px;
      --tab-track: rgb(255 255 255 / 0.06); --tab-radius: 16px; --tab-on: linear-gradient(135deg, #8b5cf6, #ec4899); --tab-on-text: #fff;
      --new-bg: linear-gradient(135deg, #8b5cf6, #ec4899); --new-text: #fff; --new-shadow: 0 10px 30px rgb(168 85 247 / 0.45);
      --nl-bg: rgb(255 255 255 / 0.1); --nl-text: #fff;
      --rec-bg: linear-gradient(135deg, #f43f5e, #ec4899); --rec-shadow: 0 0 0 10px rgb(236 72 153 / 0.18), 0 0 40px rgb(236 72 153 / 0.55);
      --gear-bg: rgb(255 255 255 / 0.08);
    }
    .t-glow .card, .t-glow .live { backdrop-filter: blur(12px); }

    /* ---------- 2. Paper Notebook ---------- */
    .t-paper {
      --bg: #f5efe3; --surface: #fffcf5; --text: #2a2420; --muted: #8c8073; --line: #e8dfcd;
      --accent: #c2552d; --font: Inter, sans-serif; --head-font: Fraunces, Georgia, serif; --title-size: 28px; --title-weight: 700;
      --radius: 6px; --card-border: 1px solid #e3d9c6; --card-shadow: 0 1px 0 #e3d9c6, 0 3px 0 -1px #fffcf5, 0 4px 0 -1px #e3d9c6;
      --btn-radius: 10px; --box-radius: 3px;
      --tab-track: transparent; --tab-radius: 0px; --tab-on: transparent; --tab-on-text: #2a2420;
      --new-bg: #2a2420; --new-text: #fffcf5;
      --nl-bg: #c2552d; --nl-text: #fffcf5;
      --rec-bg: #c2552d; --rec-border: 4px solid #fffcf5; --rec-shadow: 0 0 0 2px #2a2420; --rec-icon: #fffcf5;
      --sec-color: #c2552d;
    }
    .t-paper .tabs { border-bottom: 1px solid #ddd2bd; padding: 0; gap: 0; }
    .t-paper .tab { border-radius: 0; font-family: Fraunces, Georgia, serif; font-size: 17px; padding: 8px 0 10px; }
    .t-paper .tab.on { box-shadow: inset 0 -3px 0 #c2552d; }
    .t-paper .card { border-left: 3px solid #e7a48a; }
    .t-paper .live { background: repeating-linear-gradient(#fffcf5 0 47px, #e8dfcd 47px 48px); border-left: 3px solid #e7a48a; }
    .t-paper .todo { border-bottom-color: transparent; height: 48px; padding: 0; }
    .t-paper .sec { font-style: italic; font-weight: 500; }

    /* ---------- 3. Bold Block ---------- */
    .t-bold {
      --bg: #f3f1ea; --surface: #fff; --text: #111; --muted: #5d5d5d; --line: #111;
      --accent: #111; --font: "Space Grotesk", sans-serif; --head-font: "Space Grotesk", sans-serif; --title-size: 30px; --title-weight: 700; --title-spacing: -0.03em;
      --radius: 12px; --card-border: 2.5px solid #111; --card-shadow: 4px 4px 0 #111; --btn-radius: 12px; --box-radius: 4px;
      --tab-track: #fff; --tab-radius: 14px; --tab-border: 2.5px solid #111; --tab-on: #111; --tab-on-text: #c6ff3d;
      --new-bg: #c6ff3d; --new-text: #111; --new-border: 2.5px solid #111; --new-shadow: 4px 4px 0 #111;
      --rec-bg: #ff4d2e; --rec-radius: 22px; --rec-border: 2.5px solid #111; --rec-shadow: 4px 4px 0 #111;
      --gear-border: 2.5px solid #111; --gear-bg: #fff;
    }
    .t-bold .top h1 { text-transform: uppercase; }
    .t-bold .sec { text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; }
    .t-bold .box { border-color: #111; border-width: 2.5px; }
    .t-bold .pv::before { border-color: #111; }
    .t-bold .todo { border-bottom-width: 1.5px; }
    .t-bold .todo.current { background: #c6ff3d; margin: 0 -14px; padding: 12px 14px; border-bottom: 1.5px solid #111; }

    /* ---------- 4. Soft Sage ---------- */
    .t-soft {
      --bg: linear-gradient(180deg, #e7f2ec 0%, #f6f8f4 55%); --surface: #fff; --text: #22332b; --muted: #7c8f86; --line: #edf2ef;
      --accent: #4f9d7a; --font: Nunito, sans-serif; --head-font: Nunito, sans-serif; --title-weight: 800;
      --radius: 22px; --card-border: 0; --card-shadow: 0 6px 20px rgb(52 92 74 / 0.08); --btn-radius: 22px; --box-radius: 50%;
      --tab-track: rgb(79 157 122 / 0.12); --tab-radius: 999px; --tab-on: #fff; --tab-on-text: #2f7a5a; --tab-shadow: 0 2px 8px rgb(52 92 74 / 0.12);
      --new-bg: #4f9d7a; --new-text: #fff; --new-shadow: 0 10px 24px rgb(79 157 122 / 0.35);
      --rec-bg: #ff8a7a; --rec-shadow: 0 0 0 12px rgb(255 138 122 / 0.18);
      --gear-bg: #fff;
    }
    .t-soft .card { padding: 15px 18px; }
    .t-soft .box { border-color: #b9cfc4; }

    /* ---------- 5. Pixel Quest (16-colour EGA, Sierra adventure game) ---------- */
    .t-pixel {
      --bg: #0000aa; --surface: #fff; --text: #fff; --muted: #555; --line: #aaa;
      --accent: #aa0000; --font: VT323, monospace; --head-font: "Press Start 2P", monospace;
      --radius: 0; --box-radius: 0; --btn-radius: 0; --tab-radius: 0;
      --card-border: 0; --card-shadow: inset 0 0 0 4px #fff, inset 0 0 0 7px #aa0000, 0 -3px #000, 0 3px #000, -3px 0 #000, 3px 0 #000;
      --tab-track: transparent; --tab-on: #ffff55; --tab-on-text: #000;
      --new-bg: #00aa00; --new-text: #fff;
      --new-shadow: inset 4px 4px #55ff55, inset -4px -4px #005500, 0 -4px #000, 0 4px #000, -4px 0 #000, 4px 0 #000;
      --rec-bg: #aa0000; --rec-radius: 0;
      --rec-shadow: inset 6px 6px #ff5555, inset -6px -6px #550000, 0 -4px #000, 0 4px #000, -4px 0 #000, 4px 0 #000;
      --rec-icon: #ffff55;
      padding: 0 14px; image-rendering: pixelated;
      font-size: 20px; -webkit-font-smoothing: none;
    }
    .t-pixel .sierra {
      margin: 0 -14px; background: #fff; color: #000; font: 18px/1 VT323, monospace;
      display: flex; justify-content: space-between; padding: 30px 14px 5px; /* top padding clears the phone's camera */
    }
    .t-pixel .scene { display: block; width: calc(100% + 28px); margin: 0 -14px; height: auto; shape-rendering: crispEdges; border-bottom: 4px solid #000; }
    .t-pixel .scene-wrap { position: relative; }
    .t-pixel .scene-title {
      position: absolute; left: 0; bottom: 10px; margin: 0;
      font: 15px/1.3 "Press Start 2P", monospace; color: #ffff55; text-shadow: 3px 3px #000;
    }
    .t-pixel .scene-gear {
      position: absolute; right: 0; top: 8px; width: 34px; height: 34px; display: grid; place-items: center;
      background: #aaa; color: #000; box-shadow: inset 3px 3px #fff, inset -3px -3px #555, 0 -3px #000, 0 3px #000, -3px 0 #000, 3px 0 #000;
    }
    .t-pixel .scene-gear svg { width: 18px; height: 18px; fill: currentColor; }
    .t-pixel .tabs { margin: 18px 3px 18px; gap: 12px; padding: 0; }
    .t-pixel .tab {
      font: 10px/1 "Press Start 2P", monospace; padding: 12px 0; background: #aaa; color: #000;
      box-shadow: inset 3px 3px #fff, inset -3px -3px #555, 0 -3px #000, 0 3px #000, -3px 0 #000, 3px 0 #000;
    }
    .t-pixel .tab.on { background: #ffff55; box-shadow: inset 3px 3px #fff, inset -3px -3px #aa5500, 0 -3px #000, 0 3px #000, -3px 0 #000, 3px 0 #000; }
    .t-pixel .new { font: 12px/1 "Press Start 2P", monospace; padding: 16px; margin: 0 4px; text-shadow: 2px 2px #005500; }
    .t-pixel .new .plus { font-size: 14px; }
    .t-pixel .sec { font: 10px/1 "Press Start 2P", monospace; color: #55ffff; margin: 24px 3px 12px; }
    .t-pixel .card { color: #000; padding: 13px 17px; margin: 0 3px 14px; }
    .t-pixel .date { font: 16px/1 VT323, monospace; color: #aa0000; }
    .t-pixel .txt, .t-pixel .pv { font-size: 19px; line-height: 1.05; }
    .t-pixel .pv::before, .t-pixel .box { border: 0; background: #fff; box-shadow: inset 0 0 0 2px #000; width: 14px; height: 14px; }
    .t-pixel .pv::before { vertical-align: 0; }
    .t-pixel .meta { font: 16px/1 VT323, monospace; color: #555; }
    .t-pixel .top.center { padding: 14px 0 16px; }
    .t-pixel .top.center h1 { font: 11px/1 "Press Start 2P", monospace; color: #ffff55; text-shadow: 2px 2px #000; }
    .t-pixel .back { font: 14px/1 "Press Start 2P", monospace; width: 34px; height: 34px; background: #aaa; color: #000; border-radius: 0;
      box-shadow: inset 3px 3px #fff, inset -3px -3px #555, 0 -3px #000, 0 3px #000, -3px 0 #000, 3px 0 #000; }
    .t-pixel .live { color: #000; margin: 0 3px; padding: 10px 18px; }
    .t-pixel .todo { font-size: 21px; padding: 9px 0; border-bottom: 2px dotted #aaa; }
    .t-pixel .todo .box { width: 18px; height: 18px; box-shadow: inset 0 0 0 3px #000; }
    .t-pixel .todo.current { border-bottom: 2px dotted #aa0000; }
    .t-pixel .todo.current .t::before { content: '>'; margin-right: 6px; color: #aa0000; }
    .t-pixel .todo.current .t::after { width: 10px; height: 3px; background: #000; vertical-align: baseline; }
    .t-pixel .rec { width: 76px; height: 76px; }
    .t-pixel .rec i { width: 24px; height: 24px; border-radius: 0; box-shadow: 3px 3px #550000; }
    .t-pixel .timer { font: 13px/1 "Press Start 2P", monospace; color: #ffff55; margin: 16px 0 16px; }
    .t-pixel .nl { font: 12px/1 "Press Start 2P", monospace; padding: 18px; margin: 0 4px; text-shadow: 2px 2px #005500; }
    .t-pixel .hint { color: #55ffff; font-size: 18px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Voice Notes: 5 looks</h1>
    <p>Same app, five styles. Switch screens to compare them.</p>
    <div class="switch" role="group" aria-label="Screen">
      <button data-screen="notes" aria-pressed="true">Notes tab</button>
      <button data-screen="todo" aria-pressed="false">To-do tab</button>
      <button data-screen="rec" aria-pressed="false">Recording a list</button>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const themes = [
      { cls: 't-glow', name: '1. Midnight Glow', blurb: 'Dark and moody with a purple-to-pink glow. Feels premium and modern.', sw: ['#0e0b1f', '#8b5cf6', '#ec4899', '#f4f0ff'] },
      { cls: 't-paper', name: '2. Paper Notebook', blurb: 'Warm cream paper, serif headings, lined to-do pages. Calm and personal.', sw: ['#f5efe3', '#2a2420', '#c2552d', '#e7a48a'] },
      { cls: 't-bold', name: '3. Bold Block', blurb: 'Chunky outlines, lime and black, hard shadows. Loud, fun, very easy to tap.', sw: ['#f3f1ea', '#111111', '#c6ff3d', '#ff4d2e'] },
      { cls: 't-soft', name: '4. Soft Sage', blurb: 'Light sage green, big rounded shapes, soft shadows. Friendly and relaxed.', sw: ['#e7f2ec', '#4f9d7a', '#ff8a7a', '#22332b'] },
      { cls: 't-pixel', name: '5. Pixel Quest', blurb: 'Old Sierra adventure game: 16 EGA colours, a castle scene, score bar, and text boxes with a red border.', sw: ['#0000aa', '#00aa00', '#ffff55', '#aa0000'] },
    ];

    // Pixel castle scene for the Pixel Quest look (80 x 34 "pixels", drawn with plain rectangles).
    const R = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
    const scene = `<svg class="scene" viewBox="0 0 80 34" aria-hidden="true">
      ${R(0, 0, 80, 20, '#5555ff')}
      ${R(0, 14, 80, 1, '#55ffff')}${R(0, 16, 80, 1, '#55ffff')}${R(0, 17, 80, 3, '#55ffff')}
      ${R(56, 3, 4, 4, '#ffff55')}${R(55, 4, 6, 2, '#ffff55')}
      ${R(40, 5, 8, 2, '#fff')}${R(42, 4, 4, 1, '#fff')}${R(64, 9, 7, 1, '#fff')}${R(66, 8, 3, 1, '#fff')}
      ${R(0, 17, 14, 4, '#00aa00')}${R(4, 15, 8, 2, '#00aa00')}${R(44, 16, 36, 5, '#00aa00')}${R(52, 14, 16, 2, '#00aa00')}
      ${R(0, 20, 80, 14, '#55ff55')}
      ${R(10, 10, 20, 11, '#aaaaaa')}
      ${R(10, 9, 2, 1, '#aaaaaa')}${R(14, 9, 2, 1, '#aaaaaa')}${R(18, 9, 2, 1, '#aaaaaa')}${R(22, 9, 2, 1, '#aaaaaa')}${R(26, 9, 2, 1, '#aaaaaa')}
      ${R(7, 5, 5, 16, '#aaaaaa')}${R(28, 5, 5, 16, '#aaaaaa')}${R(17, 3, 6, 18, '#aaaaaa')}
      ${R(7, 4, 1, 1, '#aaaaaa')}${R(9, 4, 1, 1, '#aaaaaa')}${R(11, 4, 1, 1, '#aaaaaa')}
      ${R(28, 4, 1, 1, '#aaaaaa')}${R(30, 4, 1, 1, '#aaaaaa')}${R(32, 4, 1, 1, '#aaaaaa')}
      ${R(17, 2, 1, 1, '#aaaaaa')}${R(19, 2, 2, 1, '#aaaaaa')}${R(22, 2, 1, 1, '#aaaaaa')}
      ${R(20, 0, 1, 2, '#555555')}${R(21, 0, 2, 1, '#aa0000')}
      ${R(9, 1, 1, 3, '#555555')}${R(10, 1, 2, 1, '#aa0000')}${R(30, 1, 1, 3, '#555555')}${R(31, 1, 2, 1, '#aa0000')}
      ${R(9, 8, 1, 2, '#000')}${R(30, 8, 1, 2, '#000')}${R(19, 6, 2, 2, '#000')}${R(13, 12, 1, 2, '#555555')}${R(26, 12, 1, 2, '#555555')}
      ${R(18, 15, 4, 6, '#aa5500')}${R(19, 14, 2, 1, '#aa5500')}${R(20, 15, 1, 6, '#555555')}
      ${R(10, 20, 20, 1, '#555555')}
      ${R(19, 21, 3, 2, '#aa5500')}${R(21, 23, 4, 2, '#aa5500')}${R(24, 25, 5, 2, '#aa5500')}${R(28, 27, 6, 2, '#aa5500')}${R(33, 29, 8, 2, '#aa5500')}${R(40, 31, 10, 3, '#aa5500')}
      ${R(62, 13, 8, 6, '#00aa00')}${R(63, 11, 6, 2, '#00aa00')}${R(65, 19, 2, 3, '#aa5500')}${R(64, 13, 2, 1, '#55ff55')}
      ${R(71, 16, 6, 5, '#00aa00')}${R(72, 15, 4, 1, '#00aa00')}${R(73, 21, 2, 2, '#aa5500')}
      ${R(4, 24, 1, 1, '#ff55ff')}${R(8, 28, 1, 1, '#ffff55')}${R(56, 27, 1, 1, '#ff55ff')}${R(70, 30, 1, 1, '#ffff55')}${R(14, 31, 1, 1, '#ff5555')}
      ${R(52, 23, 3, 1, '#aa0000')}${R(54, 22, 1, 1, '#fff')}${R(52, 24, 3, 1, '#ffaa77')}${R(52, 25, 3, 3, '#0000aa')}${R(52, 28, 1, 2, '#555555')}${R(54, 28, 1, 2, '#555555')}
    </svg>`;

    const gear = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>';
    const status = '<div class="statusbar"><span>9:41</span><span>▂▄▆ ● 87%</span></div>';

    function home(t, tab) {
      const notes = tab === 'notes';
      const sub = t.cls === 't-soft' ? '<span class="sub">Good morning</span>' : '';
      const items = notes
        ? `<div class="card"><div class="date">Today, 09:14</div><div class="txt">Idea for the weekend: drive out to the farm stall, then lunch at the place by the river.</div></div>
           <div class="card"><div class="date">Yesterday, 18:40</div><div class="txt">Meeting notes. Supplier can deliver by the 3rd. Need final numbers before Thursday.</div></div>
           <div class="card"><div class="date">Fri, 07:12</div><div class="txt">Call the Plummer about the leak under the kitchen sink.</div></div>`
        : `<div class="card"><div class="date">Today, 07:55</div><span class="pv">Collect the dry cleaning</span><span class="pv">Pay the electricity bill</span><span class="pv">Get a birthday card for Mom</span><div class="meta">3 items</div></div>
           <div class="card"><div class="date">Mon, 12:02</div><span class="pv">Book the car service</span><span class="pv">Renew the licence disc</span><div class="meta">2 items</div></div>`;
      if (t.cls === 't-pixel') {
        return `<div class="sierra"><span>Score: ${notes ? '3 of 3' : '1 of 5'}</span><span>Sound: on</span></div>
          <div class="scene-wrap">${scene}<h1 class="scene-title">Voice<br>Notes</h1><span class="scene-gear">${gear}</span></div>
          <div class="tabs"><div class="tab ${notes ? 'on' : ''}">Notes</div><div class="tab ${notes ? '' : 'on'}">To-do</div></div>
          <div class="new"><span class="plus">+</span>${notes ? 'NEW NOTE' : 'NEW LIST'}</div>
          <div class="sec">${notes ? 'YOUR SCROLLS' : 'YOUR QUESTS'}</div>
          ${items}`;
      }
      return `${status}
        <div class="top"><h1>${sub}Voice Notes</h1><span class="gear">${gear}</span></div>
        <div class="tabs"><div class="tab ${notes ? 'on' : ''}">¶ Notes</div><div class="tab ${notes ? '' : 'on'}">☑ To-do</div></div>
        <div class="new"><span class="plus">+</span>${notes ? 'New note' : 'New to-do list'}</div>
        <div class="sec">${notes ? 'Your notes' : 'Your to-do lists'}</div>
        ${items}`;
    }

    function recording(t) {
      const pixel = t.cls === 't-pixel';
      return `${pixel ? '<div class="sierra"><span>Score: 2 of 3</span><span>Sound: on</span></div>' : status}
        <div class="top center"><span class="gear back">${pixel ? '&lt;' : '‹'}</span><h1>${pixel ? 'NEW QUEST' : 'New to-do list'}</h1><span class="spacer"></span></div>
        <div class="live">
          <div class="todo"><span class="box"></span><span class="t">Pick up the kids at three</span></div>
          <div class="todo"><span class="box"></span><span class="t">Get a birthday card for Mom</span></div>
          <div class="todo current"><span class="box"></span><span class="t">Renew the car</span></div>
        </div>
        <div class="controls">
          <div class="rec"><i></i></div>
          <div class="timer">0:14</div>
          <div class="nl"><span>↵</span>${pixel ? 'NEW LINE' : 'New line'}</div>
          <div class="hint">${pixel ? 'Speak an item, press NEW LINE, speak the next.' : 'Say an item, tap New line, say the next one.'}</div>
        </div>`;
    }

    function render(screen) {
      document.getElementById('grid').innerHTML = themes.map(t => `
        <section class="option">
          <div class="phone"><div class="screen ${t.cls}">${screen === 'rec' ? recording(t) : home(t, screen)}</div></div>
          <h2>${t.name}</h2>
          <p>${t.blurb}</p>
          <div class="swatches">${t.sw.map(c => `<span style="background:${c}"></span>`).join('')}</div>
        </section>`).join('');
    }

    for (const b of document.querySelectorAll('.switch button')) {
      b.onclick = () => {
        for (const x of document.querySelectorAll('.switch button')) x.setAttribute('aria-pressed', x === b);
        render(b.dataset.screen);
      };
    }
    render('notes');
  </script>
</body>
</html>
